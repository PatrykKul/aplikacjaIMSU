services:
  db:
    image: postgres:17
    container_name: imsu-v2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imsu}
      POSTGRES_DB: ${POSTGRES_DB:-imsu}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imsu}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: