skill: percent-ratio
method: common
title: Jakim procentem jest liczba?
steps:
  - key: intro
    type: text
    body: |
      **Pytanie:** jakim procentem liczby $20$ jest $5$?

      Zapisz to jako ułamek **część przez całość** i zamień na procenty:

      $$
      \frac{5}{20} = \frac{1}{4} = 25\%
      $$

      **Reguła:** liczba $a$ stanowi $\tfrac{a}{b} \cdot 100\%$ liczby $b$.

  - key: q-ten-of-fifty
    type: question
    prompt: |
      Jakim procentem liczby $50$ jest $10$?
    answer:
      type: number
      value: 20
      unit: "%"
      check: {op: ratio_percent, part: 10, whole: 50}
      feedback:
        - when: 5
          message: |
            Podzieliłeś $50$ przez $10$. Część dzielimy przez całość: $10 : 50$.
        - when: 500
          message: Pomnożyłeś $10 \cdot 50$. Część trzeba podzielić przez całość.
    explanation: |
      $\tfrac{10}{50} = \tfrac{1}{5} = \tfrac{20}{100} = 20\%$.

  - key: expand-to-hundred
    type: text
    body: |
      **Sposób na szybki rachunek:** rozszerz ułamek tak, żeby w mianowniku było $100$.

      $$
      \frac{7}{20} = \frac{35}{100} = 35\%
      $$

  - key: q-test-points
    type: question
    prompt: |
      Na sprawdzianie można było zdobyć $40$ punktów. Ola zdobyła $34$.
      Jaki procent punktów zdobyła?
    answer:
      type: number
      value: 85
      unit: "%"
      check: {op: ratio_percent, part: 34, whole: 40}
      feedback:
        - when: 15
          message: To procent punktów, których Oli zabrakło.
        - when: 6
          message: To liczba punktów, których zabrakło. Szukamy, jaką częścią całości jest $34$.
    hint: |
      Ola zdobyła $\tfrac{34}{40}$ punktów. Rozszerz ułamek do mianownika $100$.
    explanation: |
      $\tfrac{34}{40} = 0{,}85 = 85\%$.

  - key: q-fifteen-of-sixty
    type: question
    prompt: |
      Jakim procentem liczby $60$ jest $15$?
    answer:
      type: choice
      options:
        - text: $4\%$
          feedback: Podzieliłeś $60$ przez $15$, czyli w odwrotną stronę.
        - text: $25\%$
        - text: $45\%$
          feedback: To różnica $60 - 15$, a nie procent.
      correct: 1
    explanation: |
      $\tfrac{15}{60} = \tfrac{1}{4} = 25\%$.

  - key: q-girls
    type: question
    prompt: |
      W klasie jest $25$ uczniów, z czego $12$ to dziewczynki.
      Jaki procent klasy stanowią dziewczynki?
    answer:
      type: number
      value: 48
      unit: "%"
      check: {op: ratio_percent, part: 12, whole: 25}
      feedback:
        - when: 52
          message: To procent chłopców w klasie.
        - when: 12
          message: To liczba dziewczynek, a nie procent. Podziel ją przez liczbę wszystkich uczniów.
    hint: |
      Ile razy trzeba pomnożyć $25$, żeby dostać $100$?
    explanation: |
      $\tfrac{12}{25} = \tfrac{48}{100} = 48\%$.

  - key: q-more-than-hundred
    type: question
    prompt: |
      Jakim procentem liczby $20$ jest $30$?
    answer:
      type: number
      value: 150
      unit: "%"
      check: {op: ratio_percent, part: 30, whole: 20}
      feedback:
        - when: 50
          message: Tyle procent $30$ jest **większe** od $20$. Pytamy, jakim procentem $20$ jest $30$.
    hint: |
      Część może być większa od całości. Wtedy wynik przekracza $100\%$.
    explanation: |
      $\tfrac{30}{20} = 1{,}5 = 150\%$.

  - key: q-battery
    type: question
    prompt: |
      Bateria telefonu mieści $4000$ mAh. Teraz jest w niej $1000$ mAh.
      W ilu procentach jest naładowana?
    answer:
      type: number
      value: 25
      unit: "%"
      check: {op: ratio_percent, part: 1000, whole: 4000}
      feedback:
        - when: 4
          message: |
            Podzieliłeś $4000 : 1000$, czyli w odwrotną stronę.
        - when: 75
          message: Tyle procent baterii jest pustych.
    explanation: |
      $\tfrac{1000}{4000} = \tfrac{1}{4} = 25\%$.
