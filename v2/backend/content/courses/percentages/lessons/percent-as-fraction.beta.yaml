skill: percent-as-fraction
method: beta
title: Procenty na etykietach
steps:
  - key: goal
    type: text
    body: |
      **Zadanie na dziś:** procenty są na etykietach jedzenia, ubrań i na ekranie telefonu.
      Nauczysz się szybko odczytywać, **jaką część całości** oznaczają.

      **Przepis:**

      1. Procent to setne części: podziel przez $100$ ($70\% = 0{,}7$).
      2. Skróty: $50\%$ to połowa, $25\%$ to ćwierć, $10\%$ to jedna dziesiąta.
      3. W drugą stronę: część całości pomnóż przez $100\%$ ($\tfrac{1}{2} = 50\%$).

  - key: model
    type: text
    body: |
      **Zobacz, jak to działa.** Na czekoladzie jest napis „kakao $70\%$”.

      $70\% = \tfrac{70}{100} = 0{,}7$, czyli w $100$ g czekolady jest $70$ g kakao.

  - key: q-juice
    type: question
    prompt: |
      Na kartonie napoju jest napis „sok jabłkowy $25\%$”.
      Jaką częścią napoju jest sok? Wpisz jako liczbę dziesiętną.
    answer:
      type: number
      value: "0.25"
      check: {op: to_decimal, p: 25}
      feedback:
        - when: 25
          message: To procent. Zamień go na liczbę dziesiętną, dzieląc przez $100$.
        - when: "0.75"
          message: To reszta napoju, czyli woda i dodatki.
    hint: |
      Krok 1 przepisu: podziel przez $100$.
    explanation: |
      $25\% = 0{,}25$, czyli ćwierć napoju to sok.

  - key: q-storage
    type: question
    prompt: |
      W telefonie zajęte są $\tfrac{3}{4}$ pamięci. Ile to procent?
    answer:
      type: number
      value: 75
      unit: "%"
      check: {op: to_percent, x: "3/4"}
      feedback:
        - when: "0.75"
          message: To część pamięci zapisana dziesiętnie. Pomnóż ją przez $100\%$.
        - when: 25
          message: Tyle procent pamięci jest wolnej.
    explanation: |
      $\tfrac{3}{4} = \tfrac{75}{100} = 75\%$.

  - key: q-wool
    type: question
    prompt: |
      Na metce swetra: „wełna $80\%$, poliester $20\%$”.
      Wpisz udział wełny jako liczbę dziesiętną.
    answer:
      type: number
      value: "0.8"
      check: {op: to_decimal, p: 80}
      feedback:
        - when: "0.08"
          message: Przesunąłeś przecinek o trzy miejsca. $80\%$ to osiem dziesiątych.
        - when: 80
          message: To procent. Podziel go przez $100$.
    explanation: |
      $80\% = 0{,}8$, czyli wełna to osiem dziesiątych swetra.

  - key: q-progress
    type: question
    prompt: |
      Pasek postępu w grze ma $10$ kratek. Zapełniło się $7$.
      Ile procent gry ukończyłeś?
    answer:
      type: number
      value: 70
      unit: "%"
      check: {op: to_percent, x: "7/10"}
      feedback:
        - when: "0.7"
          message: To ukończona część gry zapisana dziesiętnie. Pomnóż ją przez $100\%$.
        - when: 30
          message: Tyle procent gry zostało ci do końca.
    explanation: |
      $\tfrac{7}{10} = \tfrac{70}{100} = 70\%$.

  - key: q-milk
    type: question
    prompt: |
      Na mleku jest napis „$2\%$ tłuszczu”. Co to znaczy?
    answer:
      type: choice
      options:
        - text: W mleku są dwie łyżki tłuszczu
          feedback: Procent nie mówi o łyżkach, tylko o tym, jaką część całości stanowi tłuszcz.
        - text: W $100$ g mleka są $2$ g tłuszczu
        - text: Połowa mleka to tłuszcz
          feedback: Połowa to $50\%$, a nie $2\%$.
      correct: 1
    explanation: |
      $2\% = \tfrac{2}{100}$, czyli na każde $100$ g mleka przypadają $2$ g tłuszczu.

  - key: q-battery
    type: question
    prompt: |
      Bateria w telefonie jest naładowana w $0{,}45$ pełnej pojemności.
      Ile procent pokaże ekran?
    answer:
      type: number
      value: 45
      unit: "%"
      check: {op: to_percent, x: "0.45"}
      feedback:
        - when: "4.5"
          message: Przesunąłeś przecinek o jedno miejsce. Mnożenie przez $100$ to dwa miejsca.
        - when: 55
          message: Tyle procent baterii jest rozładowanej.
    explanation: |
      $0{,}45 \cdot 100\% = 45\%$.
