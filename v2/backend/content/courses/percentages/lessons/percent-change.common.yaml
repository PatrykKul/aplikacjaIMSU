skill: percent-change
method: common
title: Podwyżki i obniżki
steps:
  - key: decrease
    type: text
    body: |
      **Obniżka o $p\%$:** od ceny odejmujesz $p\%$ tej ceny.

      Kurtka kosztuje $200$ zł, obniżka $30\%$. $30\%$ z $200$ zł to $60$ zł, więc nowa cena to

      $$
      200 - 60 = 140 \text{ zł}
      $$

      **Szybciej:** po obniżce o $30\%$ zostaje $70\%$ ceny, czyli $0{,}7 \cdot 200 = 140$ zł.

  - key: q-trousers
    type: question
    prompt: |
      Spodnie kosztują $150$ zł. Sklep obniżył cenę o $20\%$. Ile kosztują teraz?
    answer:
      type: number
      value: 120
      unit: zł
      check: {op: change, n: 150, p: -20}
      feedback:
        - when: 30
          message: To kwota obniżki. Odejmij ją od ceny.
        - when: 130
          message: Odjąłeś $20$ zł, a obniżka to $20$ **procent** ceny.
    explanation: |
      $20\%$ ze $150$ zł to $30$ zł, więc nowa cena to $150 - 30 = 120$ zł.

  - key: increase
    type: text
    body: |
      **Podwyżka o $p\%$:** do ceny dodajesz $p\%$ tej ceny.

      Bilet kosztuje $40$ zł i drożeje o $15\%$. Po podwyżce płacisz $115\%$ starej ceny:

      $$
      1{,}15 \cdot 40 = 46 \text{ zł}
      $$

  - key: q-subscription
    type: question
    prompt: |
      Abonament kosztował $60$ zł miesięcznie i podrożał o $10\%$. Ile kosztuje teraz?
    answer:
      type: number
      value: 66
      unit: zł
      check: {op: change, n: 60, p: 10}
      feedback:
        - when: 70
          message: Dodałeś $10$ zł, a podwyżka to $10$ **procent** ceny.
        - when: 6
          message: To kwota podwyżki. Dodaj ją do starej ceny.
    explanation: |
      $10\%$ z $60$ zł to $6$ zł, więc nowa cena to $60 + 6 = 66$ zł.

  - key: q-multiplier
    type: question
    prompt: |
      Jak w jednym kroku policzyć cenę po obniżce o $25\%$?
    answer:
      type: choice
      options:
        - text: $0{,}75 \cdot \text{cena}$
        - text: $0{,}25 \cdot \text{cena}$
          feedback: Tak liczysz samą kwotę obniżki, a nie nową cenę.
        - text: $1{,}25 \cdot \text{cena}$
          feedback: Tak liczy się cenę po **podwyżce** o $25\%$.
      correct: 0
    explanation: |
      Po obniżce o $25\%$ zostaje $75\%$ ceny, czyli $0{,}75 \cdot \text{cena}$.

  - key: change-percent
    type: text
    body: |
      **O ile procent zmieniła się cena?** Podziel zmianę przez **starą** cenę.

      Bilet podrożał z $80$ zł do $100$ zł. Zmiana to $20$ zł, więc

      $$
      \frac{20}{80} = \frac{1}{4} = 25\%
      $$

  - key: q-ticket-percent
    type: question
    prompt: |
      Bilet do kina podrożał z $50$ zł do $60$ zł. O ile procent?
    answer:
      type: number
      value: 20
      unit: "%"
      check: {op: change_percent, old: 50, new: 60}
      feedback:
        - when: 10
          message: To podwyżka w złotych. Podziel ją przez starą cenę.
        - when: 120
          message: Tyle procent starej ceny wynosi nowa cena. Podwyżka to $120\% - 100\%$.
    explanation: |
      Zmiana to $10$ zł, a $\tfrac{10}{50} = 20\%$.

  - key: q-game-sale
    type: question
    prompt: |
      Gra kosztowała $200$ zł, a teraz kosztuje $170$ zł. O ile procent ją przeceniono?
    answer:
      type: number
      value: 15
      unit: "%"
      check: {op: change_percent, old: 200, new: 170}
      feedback:
        - when: 30
          message: To obniżka w złotych. Podziel ją przez starą cenę.
        - when: 85
          message: Tyle procent starej ceny wynosi nowa cena. Obniżka to $100\% - 85\%$.
    hint: |
      O ile złotych potaniała gra?
    explanation: |
      Zmiana to $30$ zł, a $\tfrac{30}{200} = \tfrac{15}{100} = 15\%$.
