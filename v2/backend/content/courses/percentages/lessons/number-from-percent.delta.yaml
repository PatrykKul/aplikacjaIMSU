skill: number-from-percent
method: delta
title: "Misja: zbiórka elektrośmieci"
steps:
  - key: story
    type: text
    body: |
      **Szkoła zbiera elektrośmieci:** stare telefony, ładowarki, baterie.
      Wyrzucone do zwykłego kosza zatruwają glebę i wodę, a oddane do recyklingu dostają drugie życie.

      Gmina obiecała nagrodę, jeśli szkoła osiągnie swój cel. Ty prowadzisz **tablicę wyników**.

  - key: q-goal
    type: question
    prompt: |
      Po tygodniu zebraliście $120$ kg, czyli $30\%$ celu. Ile kilogramów wynosi cel?
    answer:
      type: number
      value: 400
      unit: kg
      check: {op: whole_from_part, p: 30, part: 120}
      feedback:
        - when: 36
          message: Policzyłeś $30\%$ ze $120$ kg. Tu $120$ kg to dopiero $30\%$ celu.
        - when: 280
          message: Tyle kilogramów jeszcze brakuje. Pytamy o cały cel.
    explanation: |
      $30\%$ to $120$ kg, więc $10\%$ to $40$ kg, a cały cel to $400$ kg.

  - key: q-school-total
    type: question
    prompt: |
      Klasa 7b zebrała $45$ kg, czyli $15\%$ tego, co zebrała do tej pory cała szkoła.
      Ile kilogramów zebrała szkoła?
    answer:
      type: number
      value: 300
      unit: kg
      check: {op: whole_from_part, p: 15, part: 45}
      feedback:
        - when: "6.75"
          message: Policzyłeś $15\%$ z $45$ kg. Tu $45$ kg to dopiero $15\%$ zbiórki.
    hint: |
      Ile kilogramów to $5\%$?
    explanation: |
      $15\%$ to $45$ kg, więc $5\%$ to $15$ kg, a całość to $20 \cdot 15 = 300$ kg.

  - key: q-batteries
    type: question
    prompt: |
      Zużyte baterie to $8\%$ zebranej masy, czyli $24$ kg. Ile kilogramów zebrano łącznie?
    answer:
      type: number
      value: 300
      unit: kg
      check: {op: whole_from_part, p: 8, part: 24}
      feedback:
        - when: "1.92"
          message: Policzyłeś $8\%$ z $24$ kg. Tu $24$ kg to dopiero $8\%$ zbiórki.
    explanation: |
      $24 : 8 = 3$ kg to $1\%$, więc całość to $300$ kg. Zgadza się z wynikiem z poprzedniego pytania!

  - key: classes
    type: text
    body: |
      **Rywalizacja klas.** Dwie klasy pochwaliły się wynikami:

      - 7a zebrała $36$ kg, czyli $12\%$ **swojego** celu,
      - 7c zebrała $40$ kg, czyli $20\%$ **swojego** celu.

  - key: q-bigger-goal
    type: question
    prompt: |
      Która klasa postawiła sobie większy cel?
    answer:
      type: choice
      options:
        - text: Klasa 7a
        - text: Klasa 7c
          feedback: $40$ kg to $20\%$ celu 7c, więc jej cel to $200$ kg. Policz cel 7a.
        - text: Obie tyle samo
          feedback: Policz cel każdej klasy osobno.
      correct: 0
    explanation: |
      Cel 7a to $36 : 12 \cdot 100 = 300$ kg, a cel 7c to $40 : 20 \cdot 100 = 200$ kg.
      Klasa 7a postawiła sobie ambitniejszy cel.

  - key: q-remaining
    type: question
    prompt: |
      Ile kilogramów zostało jeszcze klasie 7c do jej celu $200$ kg ($80\%$ celu)?
    answer:
      type: number
      value: 160
      unit: kg
      check: {op: percent_of, p: 80, n: 200}
      feedback:
        - when: 40
          message: Tyle 7c już zebrała.
    explanation: |
      $80\%$ z $200$ kg to $160$ kg.

  - key: finale
    type: text
    body: |
      **Twoja tablica wyników pokazuje całą prawdę:** nie tylko kto zebrał najwięcej,
      ale też kto postawił sobie najwyższy cel.

      **Pomyśl:** co jeszcze w twoim domu mogłoby trafić do recyklingu zamiast do kosza?
