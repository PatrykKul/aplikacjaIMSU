skill: percent-ratio
method: delta
title: "Misja: ankieta do gazetki szkolnej"
steps:
  - key: story
    type: text
    body: |
      **Redakcja gazetki szkolnej** zapytała $200$ uczniów o przerwy:
      jak je spędzają i co chcieliby zmienić.

      Jesteś **redaktorem działu „Nasza szkoła”**. Zamieniasz wyniki na procenty,
      żeby czytelnicy od razu zobaczyli, co myśli szkoła.

  - key: q-pitch
    type: question
    prompt: |
      $80$ osób spędza przerwy na boisku. Jaki to procent ankietowanych?
    answer:
      type: number
      value: 40
      unit: "%"
      check: {op: ratio_percent, part: 80, whole: 200}
      feedback:
        - when: "2.5"
          message: Podzieliłeś $200$ przez $80$, czyli odwrotnie.
        - when: "0.4"
          message: To wynik dziesiętny. Czytelnicy wolą procenty.
    explanation: |
      $\tfrac{80}{200} = \tfrac{40}{100} = 40\%$.

  - key: q-library
    type: question
    prompt: |
      $50$ osób woli bibliotekę. Jaki to procent?
    answer:
      type: number
      value: 25
      unit: "%"
      check: {op: ratio_percent, part: 50, whole: 200}
      feedback:
        - when: 4
          message: Podzieliłeś $200$ przez $50$, czyli odwrotnie.
    explanation: |
      $\tfrac{50}{200} = \tfrac{1}{4} = 25\%$.

  - key: q-phones
    type: question
    prompt: |
      $30$ osób chciałoby zakazu telefonów na przerwach. Jaki to procent?
    answer:
      type: number
      value: 15
      unit: "%"
      check: {op: ratio_percent, part: 30, whole: 200}
      feedback:
        - when: 85
          message: Tyle procent uczniów **nie** chce takiego zakazu.
    explanation: |
      $\tfrac{30}{200} = \tfrac{15}{100} = 15\%$.

  - key: threshold
    type: text
    body: |
      **Ważna informacja od dyrekcji:** zasady przerw zmienią się, jeśli za zmianą opowie się
      **ponad $20\%$ uczniów**. Twój artykuł może więc coś naprawdę zmienić.

  - key: q-above-threshold
    type: question
    prompt: |
      Czy pomysł zakazu telefonów przekracza próg $20\%$?
    answer:
      type: choice
      options:
        - text: Tak
          feedback: Za zakazem jest $15\%$ uczniów, a to mniej niż $20\%$.
        - text: Nie
        - text: Nie da się tego policzyć
          feedback: Da się. Porównaj wynik $15\%$ z progiem $20\%$.
      correct: 1
    explanation: |
      $15\% < 20\%$, więc zasady na razie się nie zmienią.

  - key: q-needed
    type: question
    prompt: |
      Ilu uczniów musiałoby poprzeć zakaz, żeby osiągnąć $20\%$ ankietowanych?
    answer:
      type: number
      value: 40
      check: {op: percent_of, p: 20, n: 200}
      feedback:
        - when: 10
          message: Tylu uczniów brakuje do progu. Pytamy o wszystkich potrzebnych.
    explanation: |
      $20\%$ z $200$ to $40$ uczniów, czyli o $10$ więcej niż teraz.

  - key: q-green
    type: question
    prompt: |
      Pomysł „Zielona przerwa” (sadzenie kwiatów przed szkołą) poparło $46$ uczniów.
      Jaki to procent? Czy przekracza próg?
    answer:
      type: number
      value: 23
      unit: "%"
      check: {op: ratio_percent, part: 46, whole: 200}
      feedback:
        - when: "0.23"
          message: To wynik dziesiętny. Zamień go na procenty.
    explanation: |
      $\tfrac{46}{200} = \tfrac{23}{100} = 23\%$. To ponad $20\%$, więc pomysł ma szansę wejść w życie!

  - key: finale
    type: text
    body: |
      **Twój artykuł jest gotowy.** Dzięki procentom każdy czytelnik od razu widzi,
      które pomysły popiera wielu uczniów, a które tylko nieliczni.

      **Pomyśl:** o co ty zapytałbyś uczniów w swojej szkole? Jaki próg poparcia byłby uczciwy?
