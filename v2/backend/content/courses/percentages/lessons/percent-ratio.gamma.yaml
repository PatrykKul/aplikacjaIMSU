skill: percent-ratio
method: gamma
title: "Zagadka: kto rzuca lepiej?"
steps:
  - key: problem
    type: text
    body: |
      **Zagadka:** Ola trafiła do kosza $9$ razy na $12$ rzutów. Kuba trafił $14$ razy na $20$ rzutów.

      Kuba trafił więcej razy. Ale czy to znaczy, że rzuca lepiej?

  - key: q-ola
    type: question
    prompt: |
      Jaki procent rzutów trafiła Ola?
    answer:
      type: number
      value: 75
      unit: "%"
      check: {op: ratio_percent, part: 9, whole: 12}
      feedback:
        - when: 3
          message: To liczba chybionych rzutów. Szukamy procentu trafionych.
        - when: "0.75"
          message: To wynik dziesiętny. Zamień go na procenty.
    hint: |
      Skróć $\tfrac{9}{12}$.
    explanation: |
      $\tfrac{9}{12} = \tfrac{3}{4} = 75\%$.

  - key: q-kuba
    type: question
    prompt: |
      A jaki procent rzutów trafił Kuba?
    answer:
      type: number
      value: 70
      unit: "%"
      check: {op: ratio_percent, part: 14, whole: 20}
      feedback:
        - when: 6
          message: To liczba chybionych rzutów. Szukamy procentu trafionych.
    explanation: |
      $\tfrac{14}{20} = \tfrac{70}{100} = 70\%$.

  - key: q-who
    type: question
    prompt: |
      Kto rzuca skuteczniej?
    answer:
      type: choice
      options:
        - text: Ola
        - text: Kuba, bo trafił więcej razy
          feedback: Kuba oddał też więcej rzutów. Porównaj procenty trafień.
        - text: Oboje tak samo
          feedback: Porównaj procenty trafień, które policzyłeś.
      correct: 0
    explanation: |
      Ola trafia $75\%$ rzutów, a Kuba $70\%$. Skuteczniejsza jest Ola.

  - key: discovery
    type: text
    body: |
      **Twoje odkrycie:** do porównania nie wystarczy liczba trafień.
      Liczy się, **jaką część wszystkich prób** stanowią trafienia.

      Procent sprowadza różne całości do jednej, wspólnej: do $100$.
      Dlatego wyniki z różnych meczów, klas czy sklepów można porównać dopiero w procentach.

  - key: q-third-player
    type: question
    prompt: |
      Sprawdź odkrycie: Ania trafiła $16$ razy na $25$ rzutów. Jaki to procent?
      Czy rzuca lepiej od Kuby?
    answer:
      type: number
      value: 64
      unit: "%"
      check: {op: ratio_percent, part: 16, whole: 25}
      feedback:
        - when: 9
          message: To liczba chybionych rzutów. Szukamy procentu trafionych.
    explanation: |
      $\tfrac{16}{25} = \tfrac{64}{100} = 64\%$. Ania trafiła najwięcej razy z trojga, ale rzuca najsłabiej.

  - key: q-star-match
    type: question
    prompt: |
      ★ Kuba odda w następnym meczu $40$ rzutów. Ile musi trafić, żeby mieć taką skuteczność jak Ola?
    answer:
      type: number
      value: 30
      check: {op: percent_of, p: 75, n: 40}
      feedback:
        - when: 10
          message: Tyle rzutów może chybić. Pytamy, ile musi trafić.
    hint: |
      Ola trafia $\tfrac{3}{4}$ rzutów.
    explanation: |
      $75\%$ z $40$ to $\tfrac{3}{4} \cdot 40 = 30$ rzutów.

  - key: q-star-over
    type: question
    prompt: |
      ★ Jakim procentem liczby $8$ jest $10$?
    answer:
      type: number
      value: 125
      unit: "%"
      check: {op: ratio_percent, part: 10, whole: 8}
      feedback:
        - when: 80
          message: To odwrotne pytanie, czyli jakim procentem $10$ jest $8$.
    explanation: |
      $\tfrac{10}{8} = 1{,}25 = 125\%$. Gdy część jest większa od całości, wynik przekracza $100\%$.
