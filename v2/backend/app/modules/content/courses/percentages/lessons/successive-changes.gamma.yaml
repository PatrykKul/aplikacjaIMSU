skill: successive-changes
method: gamma
title: "Zagadka: czy kolejność zmian ma znaczenie?"
steps:
  - key: problem
    type: text
    body: |
      **Zagadka:** w sklepie A cena najpierw rośnie o $20\%$, a potem spada o $10\%$.
      W sklepie B najpierw spada o $10\%$, a potem rośnie o $20\%$.

      Gdzie będzie taniej? Zgadnij, a potem sprawdź.

  - key: q-shop-a
    type: question
    prompt: |
      Sklep A: cena $100$ zł, najpierw $+20\%$, potem $-10\%$. Ile wynosi?
    answer:
      type: number
      value: 108
      unit: zł
      check: {op: successive, n: 100, ps: [20, -10]}
      feedback:
        - when: 110
          message: Dodałeś procenty ($20\% - 10\%$). Licz krok po kroku.
    explanation: |
      $100 \cdot 1{,}2 = 120$ zł, a $120 \cdot 0{,}9 = 108$ zł.

  - key: q-shop-b
    type: question
    prompt: |
      Sklep B: cena $100$ zł, najpierw $-10\%$, potem $+20\%$. Ile wynosi?
    answer:
      type: number
      value: 108
      unit: zł
      check: {op: successive, n: 100, ps: [-10, 20]}
      feedback:
        - when: 110
          message: Dodałeś procenty. Licz krok po kroku.
    explanation: |
      $100 \cdot 0{,}9 = 90$ zł, a $90 \cdot 1{,}2 = 108$ zł.

  - key: q-notice
    type: question
    prompt: |
      Co zauważasz?
    answer:
      type: choice
      options:
        - text: Kolejność zmian nie ma znaczenia
        - text: Kolejność zmienia wynik
          feedback: Obie drogi dały $108$ zł.
        - text: Wynik zawsze wraca do $100$ zł
          feedback: Wyszło $108$ zł, a nie $100$ zł.
      correct: 0
    explanation: |
      W obu sklepach wyszło $108$ zł.

  - key: q-verify
    type: question
    prompt: |
      Sprawdź na innych liczbach: $200$ zł, najpierw $-25\%$, potem $+50\%$.
      Potem w myślach odwróć kolejność. Ile wychodzi?
    answer:
      type: number
      value: 225
      unit: zł
      check: {op: successive, n: 200, ps: [-25, 50]}
      feedback:
        - when: 250
          message: Dodałeś procenty ($50\% - 25\% = 25\%$). Licz krok po kroku.
    explanation: |
      $200 \cdot 0{,}75 \cdot 1{,}5 = 225$ zł, a w odwrotnej kolejności $200 \cdot 1{,}5 \cdot 0{,}75 = 225$ zł.

  - key: discovery
    type: text
    body: |
      **Twoje odkrycie:** każda zmiana to mnożenie przez mnożnik, a mnożenie jest **przemienne**:

      $$
      1{,}2 \cdot 0{,}9 = 0{,}9 \cdot 1{,}2 = 1{,}08
      $$

      Dlatego kolejność zmian procentowych nie wpływa na cenę końcową.
      Ważne jest tylko, **jakie** to zmiany, a nie w jakiej kolejności.

  - key: q-star-back
    type: question
    prompt: |
      ★ Cena wzrosła o $25\%$. O ile procent musi teraz spaść, żeby wrócić do początku?
    answer:
      type: number
      value: 20
      unit: "%"
      check: {op: change_percent, old: 125, new: 100}
      feedback:
        - when: 25
          message: Spadek liczysz od wyższej ceny, więc w procentach musi być mniejszy.
    hint: |
      Weź cenę $100$ zł. Ile kosztuje po podwyżce?
    explanation: |
      Ze $100$ zł robi się $125$ zł. Żeby wrócić, cena musi spaść o $25$ zł, a $\tfrac{25}{125} = 20\%$.

  - key: q-star-halves
    type: question
    prompt: |
      ★ Cenę obniżono dwa razy po $50\%$. Ile procent pierwotnej ceny zostało?
    answer:
      type: number
      value: 25
      unit: "%"
      check: {op: successive, n: 100, ps: [-50, -50]}
      feedback:
        - when: 0
          message: Dwie obniżki po $50\%$ to nie obniżka o $100\%$. Druga liczy się od połowy ceny.
    explanation: |
      $0{,}5 \cdot 0{,}5 = 0{,}25$, czyli zostaje $25\%$ ceny.
