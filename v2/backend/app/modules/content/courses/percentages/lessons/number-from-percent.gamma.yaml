skill: number-from-percent
method: gamma
title: "Zagadka: ile gier ma sklep?"
steps:
  - key: problem
    type: text
    body: |
      **Zagadka:** sprzedawca pokazuje półkę z $14$ grami i mówi:
      „To tylko $10\%$ wszystkich naszych gier”.

      Ile gier ma sklep? A co, gdyby te same $14$ gier było $20\%$ wszystkich?

  - key: q-ten-percent
    type: question
    prompt: |
      Ile gier ma sklep, jeśli $14$ gier to $10\%$?
    answer:
      type: number
      value: 140
      check: {op: whole_from_part, p: 10, part: 14}
      feedback:
        - when: "1.4"
          message: Policzyłeś $10\%$ z $14$. Tu $14$ gier to dopiero $10\%$.
    explanation: |
      $10\%$ to $14$ gier, więc $100\%$ to $140$ gier.

  - key: q-twenty-percent
    type: question
    prompt: |
      A gdyby $14$ gier stanowiło $20\%$ wszystkich?
    answer:
      type: number
      value: 70
      check: {op: whole_from_part, p: 20, part: 14}
      feedback:
        - when: 280
          message: Większy procent przy tej samej części oznacza **mniejszą** całość. Sprawdź jeszcze raz.
    hint: |
      Ile gier to wtedy $10\%$?
    explanation: |
      $20\%$ to $14$ gier, więc $10\%$ to $7$ gier, a $100\%$ to $70$ gier.

  - key: q-notice
    type: question
    prompt: |
      Co zauważasz?
    answer:
      type: choice
      options:
        - text: Procent nie ma wpływu na całość
          feedback: Przy $10\%$ wyszło $140$ gier, a przy $20\%$ tylko $70$.
        - text: Im większy procent, tym większa całość
          feedback: Sprawdź swoje wyniki. Przy $20\%$ wyszło mniej niż przy $10\%$.
        - text: Dwa razy większy procent — dwa razy mniejsza całość
      correct: 2
    explanation: |
      Ta sama część stanowi dwa razy większy procent tylko wtedy, gdy całość jest dwa razy mniejsza.

  - key: q-verify
    type: question
    prompt: |
      Sprawdź odkrycie: $14$ gier to $40\%$ wszystkich. Ile gier ma sklep?
    answer:
      type: number
      value: 35
      check: {op: whole_from_part, p: 40, part: 14}
      feedback:
        - when: "5.6"
          message: Policzyłeś $40\%$ z $14$. Tu $14$ gier to dopiero $40\%$.
    explanation: |
      $40\%$ to cztery razy $10\%$, więc całość to cztery razy mniej niż $140$, czyli $35$.

  - key: discovery
    type: text
    body: |
      **Twoje odkrycie:** gdy część się nie zmienia, całość i procent są **odwrotnie proporcjonalne**:

      $$
      \text{całość} = \frac{\text{część} \cdot 100}{p}
      $$

      Dwa razy większy procent daje dwa razy mniejszą całość, cztery razy większy — cztery razy mniejszą.

  - key: q-star-five
    type: question
    prompt: |
      ★ $14$ gier to $5\%$ wszystkich. Ile gier ma sklep? Skorzystaj z odkrycia.
    answer:
      type: number
      value: 280
      check: {op: whole_from_part, p: 5, part: 14}
      feedback:
        - when: 70
          message: Mniejszy procent przy tej samej części oznacza **większą** całość.
    explanation: |
      $5\%$ to połowa z $10\%$, więc całość jest dwa razy większa niż $140$, czyli $280$.

  - key: q-star-seventy
    type: question
    prompt: |
      ★ $30\%$ pewnej liczby to $21$. Ile to jest $70\%$ tej liczby?
    answer:
      type: number
      value: 49
      check: {op: percent_of, p: 70, n: 70}
      feedback:
        - when: 70
          message: To cała liczba. Policz jeszcze $70\%$ z niej.
    hint: |
      Najpierw znajdź całą liczbę.
    explanation: |
      $30\%$ to $21$, więc $10\%$ to $7$, a cała liczba to $70$. Wtedy $70\%$ to $7 \cdot 7 = 49$.
