skill: percent-ratio
method: beta
title: Ile procent już masz?
steps:
  - key: goal
    type: text
    body: |
      **Zadanie na dziś:** chcesz szybko sprawdzić, jaką część celu już masz —
      oszczędności, pobieranej gry albo przebiegniętej trasy.

      **Przepis:**

      1. Podziel to, co masz, przez całość.
      2. Wynik pomnóż przez $100\%$.

  - key: model
    type: text
    body: |
      **Zobacz, jak to działa.** Zbierasz na rower za $800$ zł i masz już $200$ zł.

      $200 : 800 = 0{,}25$, a $0{,}25 \cdot 100\% = 25\%$.

      Masz już ćwierć potrzebnej kwoty.

  - key: q-console
    type: question
    prompt: |
      Zbierasz na konsolę za $1200$ zł i masz już $300$ zł. Jaki to procent ceny?
    answer:
      type: number
      value: 25
      unit: "%"
      check: {op: ratio_percent, part: 300, whole: 1200}
      feedback:
        - when: 4
          message: Podzieliłeś $1200$ przez $300$, czyli odwrotnie.
        - when: 75
          message: Tyle procent ceny jeszcze ci brakuje.
    hint: |
      Krok 1 przepisu: podziel $300$ przez $1200$.
    explanation: |
      $300 : 1200 = 0{,}25 = 25\%$.

  - key: q-download
    type: question
    prompt: |
      Gra ma $2000$ MB. Pobrało się już $1500$ MB. Ile procent gry jest pobrane?
    answer:
      type: number
      value: 75
      unit: "%"
      check: {op: ratio_percent, part: 1500, whole: 2000}
      feedback:
        - when: 25
          message: Tyle procent zostało jeszcze do pobrania.
        - when: 500
          message: To liczba megabajtów, które zostały. Pytamy o procent pobranej części.
    explanation: |
      $1500 : 2000 = 0{,}75 = 75\%$.

  - key: q-run
    type: question
    prompt: |
      Trasa biegu ma $5$ km. Przebiegłeś $3$ km. Jaki procent trasy?
    answer:
      type: number
      value: 60
      unit: "%"
      check: {op: ratio_percent, part: 3, whole: 5}
      feedback:
        - when: 40
          message: Tyle procent trasy zostało ci do mety.
        - when: 2
          message: To liczba kilometrów do mety. Pytamy o procent.
    explanation: |
      $3 : 5 = 0{,}6 = 60\%$.

  - key: q-yoghurt
    type: question
    prompt: |
      W kubeczku jogurtu ($250$ g) jest $10$ g cukru. Jaki procent masy jogurtu to cukier?
    answer:
      type: number
      value: 4
      unit: "%"
      check: {op: ratio_percent, part: 10, whole: 250}
      feedback:
        - when: 25
          message: Podzieliłeś $250$ przez $10$, czyli odwrotnie.
        - when: "0.04"
          message: To wynik dziesiętny. Pomnóż go przez $100\%$.
    explanation: |
      $10 : 250 = 0{,}04 = 4\%$.

  - key: q-bikes
    type: question
    prompt: |
      W klasie jest $30$ osób, a $6$ z nich przyjeżdża rowerem. Który zapis to opisuje?
    answer:
      type: choice
      options:
        - text: $6\%$ klasy
          feedback: $6$ to liczba osób, a nie procent.
        - text: $5\%$ klasy
          feedback: Podzieliłeś $30$ przez $6$, czyli odwrotnie.
        - text: $20\%$ klasy
      correct: 2
    explanation: |
      $6 : 30 = 0{,}2 = 20\%$.

  - key: q-points
    type: question
    prompt: |
      Na kartkówce zdobyłeś $18$ z $24$ punktów. Jaki to procent?
    answer:
      type: number
      value: 75
      unit: "%"
      check: {op: ratio_percent, part: 18, whole: 24}
      feedback:
        - when: 25
          message: Tyle procent punktów ci zabrakło.
        - when: "0.75"
          message: To wynik dziesiętny. Pomnóż go przez $100\%$.
    explanation: |
      $18 : 24 = 0{,}75 = 75\%$.
