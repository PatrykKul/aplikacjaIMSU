skill: percent-of-number
method: gamma
title: "Zagadka: 30% z 50 czy 50% z 30?"
steps:
  - key: problem
    type: text
    body: |
      **Zagadka:** co jest większe — $30\%$ z $50$ czy $50\%$ z $30$?

      Zanim policzysz, zgadnij. Potem sprawdź rachunkiem.

  - key: q-first
    type: question
    prompt: |
      Oblicz $30\%$ z $50$.
    answer:
      type: number
      value: 15
      check: {op: percent_of, p: 30, n: 50}
      feedback:
        - when: 1500
          message: Pomnożyłeś $30 \cdot 50$. Procent to setne części.
    hint: |
      Ile to $10\%$ z $50$?
    explanation: |
      $\tfrac{30}{100} \cdot 50 = 15$.

  - key: q-second
    type: question
    prompt: |
      Teraz oblicz $50\%$ z $30$.
    answer:
      type: number
      value: 15
      check: {op: percent_of, p: 50, n: 30}
      feedback:
        - when: 1500
          message: Pomnożyłeś $50 \cdot 30$. Procent to setne części.
    hint: |
      $50\%$ to połowa.
    explanation: |
      Połowa z $30$ to $15$.

  - key: q-why
    type: question
    prompt: |
      Obie liczby są równe. Dlaczego?
    answer:
      type: choice
      options:
        - text: To przypadek, dla innych liczb nie zadziała
          feedback: Sprawdź na innych liczbach, na przykład $20\%$ z $40$ i $40\%$ z $20$.
        - text: Bo $30$ i $50$ to okrągłe liczby
          feedback: Sprawdź na liczbach nieokrągłych, na przykład $12\%$ z $25$ i $25\%$ z $12$.
        - text: W obu przypadkach liczymy $\tfrac{30 \cdot 50}{100}$
      correct: 2
    explanation: |
      $\tfrac{30}{100} \cdot 50 = \tfrac{30 \cdot 50}{100} = \tfrac{50}{100} \cdot 30$.
      Mnożenie jest przemienne, więc kolejność liczb nie ma znaczenia.

  - key: q-verify
    type: question
    prompt: |
      Sprawdź odkrycie na innych liczbach. Ile to $40\%$ z $20$?
      Porównaj z $20\%$ z $40$.
    answer:
      type: number
      value: 8
      check: {op: percent_of, p: 40, n: 20}
      feedback:
        - when: 800
          message: Pomnożyłeś $40 \cdot 20$. Procent to setne części.
    explanation: |
      $40\%$ z $20$ to $8$ i $20\%$ z $40$ to też $8$. Odkrycie działa.

  - key: discovery
    type: text
    body: |
      **Twoje odkrycie:** $p\%$ z $n$ to tyle samo co $n\%$ z $p$, bo

      $$
      \frac{p}{100} \cdot n = \frac{p \cdot n}{100} = \frac{n}{100} \cdot p
      $$

      **Trik:** zanim zaczniesz liczyć, sprawdź, czy po zamianie liczb miejscami nie jest łatwiej.

  - key: q-four-of-seventy-five
    type: question
    prompt: |
      Oblicz w pamięci $4\%$ z $75$.
    answer:
      type: number
      value: 3
      check: {op: percent_of, p: 4, n: 75}
      feedback:
        - when: 300
          message: Pomnożyłeś $4 \cdot 75$. Procent to setne części.
        - when: 71
          message: Odjąłeś $4$ od $75$. Szukasz części liczby.
    hint: |
      Zamień liczby miejscami.
    explanation: |
      $4\%$ z $75$ to $75\%$ z $4$, czyli trzy czwarte z $4$, a to $3$.

  - key: q-sixteen-of-twenty-five
    type: question
    prompt: |
      Oblicz w pamięci $16\%$ z $25$.
    answer:
      type: number
      value: 4
      check: {op: percent_of, p: 16, n: 25}
      feedback:
        - when: 400
          message: Pomnożyłeś $16 \cdot 25$. Procent to setne części.
    hint: |
      $25\%$ to ćwierć.
    explanation: |
      $16\%$ z $25$ to $25\%$ z $16$, czyli ćwierć z $16$, a to $4$.

  - key: q-star
    type: question
    prompt: |
      ★ Oblicz w pamięci $48\%$ z $25$.
    answer:
      type: number
      value: 12
      check: {op: percent_of, p: 48, n: 25}
      feedback:
        - when: 1200
          message: Pomnożyłeś $48 \cdot 25$. Procent to setne części.
    explanation: |
      $48\%$ z $25$ to $25\%$ z $48$, czyli ćwierć z $48$, a to $12$.
