skill: percent-of-number
method: delta
title: "Misja: zbiórka dla schroniska"
steps:
  - key: story
    type: text
    body: |
      **Misja klasy 7b.** Schronisko „Łapa” prosi o pomoc: przed zimą potrzebuje karmy.
      Wasza klasa postanawia zebrać **$1500$ zł**.

      Zostajesz **skarbnikiem zbiórki**. Twoje zadanie: pilnować, ile już macie i ile jeszcze brakuje.
      Procent to twoje główne narzędzie: $p\%$ z kwoty to $\tfrac{p}{100}$ tej kwoty.

  - key: q-first-week
    type: question
    prompt: |
      Po pierwszym tygodniu macie $40\%$ celu. Ile to złotych?
    answer:
      type: number
      value: 600
      unit: zł
      check: {op: percent_of, p: 40, n: 1500}
      feedback:
        - when: 900
          message: Tyle jeszcze brakuje do celu ($60\%$).
        - when: 1460
          message: Odjąłeś $40$ zł, a macie $40$ **procent** celu.
    hint: |
      $10\%$ z $1500$ zł to $150$ zł.
    explanation: |
      $10\%$ celu to $150$ zł, więc $40\%$ to $4 \cdot 150 = 600$ zł.

  - key: q-council
    type: question
    prompt: |
      Samorząd szkolny obiecał dołożyć $10\%$ celu. Ile dołoży?
    answer:
      type: number
      value: 150
      unit: zł
      check: {op: percent_of, p: 10, n: 1500}
      feedback:
        - when: 1490
          message: Odjąłeś $10$ zł od celu. Samorząd dokłada $10$ **procent** celu.
        - when: 15
          message: To $1\%$ celu. Przy $10\%$ przesuwasz przecinek tylko o jedno miejsce.
    explanation: |
      $10\%$ z $1500$ zł to $150$ zł.

  - key: decision
    type: text
    body: |
      **Decyzja klasy.** Na weekend są dwa pomysły:

      - **kiermasz ciast**, który zwykle daje około $15\%$ celu,
      - **zbiórka puszek** do recyklingu, która daje około $12\%$ celu, ale przy okazji sprząta okolicę.

      Klasa chce najpierw wiedzieć, który pomysł przyniesie więcej pieniędzy.

  - key: q-choose-event
    type: question
    prompt: |
      Który pomysł przyniesie więcej pieniędzy na karmę?
    answer:
      type: choice
      options:
        - text: Kiermasz ciast
        - text: Zbiórka puszek
          feedback: $12\%$ z $1500$ zł to $180$ zł, a kiermasz daje $225$ zł. Puszki mają za to inny plus.
        - text: Oba tyle samo
          feedback: Policz $15\%$ i $12\%$ z $1500$ zł i porównaj.
      correct: 0
    explanation: |
      Kiermasz daje $15\%$ z $1500$ zł, czyli $225$ zł, a puszki $12\%$, czyli $180$ zł.
      Więcej pieniędzy da kiermasz, ale puszki pomagają też środowisku. Może warto zrobić jedno i drugie?

  - key: q-medicine
    type: question
    prompt: |
      Udało się zebrać cały cel! Schronisko przeznaczy $20\%$ pieniędzy na leki dla psów.
      Ile złotych pójdzie na leki?
    answer:
      type: number
      value: 300
      unit: zł
      check: {op: percent_of, p: 20, n: 1500}
      feedback:
        - when: 1200
          message: To pieniądze, które zostaną na karmę ($80\%$).
        - when: 1480
          message: Odjąłeś $20$ zł, a na leki idzie $20$ **procent** kwoty.
    explanation: |
      $10\%$ to $150$ zł, więc $20\%$ to $300$ zł.

  - key: q-sponsor
    type: question
    prompt: |
      Lokalny sklep zoologiczny dokłada od siebie $5\%$ zebranej kwoty. Ile dołoży?
    answer:
      type: number
      value: 75
      unit: zł
      check: {op: percent_of, p: 5, n: 1500}
      feedback:
        - when: 7500
          message: Pomnożyłeś $5 \cdot 1500$, ale nie podzieliłeś przez $100$.
        - when: 150
          message: To $10\%$. $5\%$ to połowa z tego.
    hint: |
      $5\%$ to połowa z $10\%$.
    explanation: |
      $10\%$ to $150$ zł, więc $5\%$ to połowa, czyli $75$ zł.

  - key: finale
    type: text
    body: |
      **Misja wykonana!** Dzięki waszej klasie psy ze schroniska przetrwają zimę najedzone.

      **Czego się nauczyłeś:**

      $$
      p\% \text{ z } n = \frac{p}{100} \cdot n
      $$

      **Pomyśl:** jaką akcję mogłaby zorganizować twoja klasa? Ile procent celu dałby każdy pomysł?
