skill: number-from-percent
title: Cała liczba z jej procentu
steps:
  - key: intro
    type: text
    body: |
      **Zagadka:** $10\%$ pewnej liczby to $7$. Jaka to liczba?

      Skoro $10\%$ to $7$, to całość, czyli $100\%$, jest dziesięć razy większa:

      $$
      10 \cdot 7 = 70
      $$

      **Ogólnie:** najpierw policz $1\%$ (podziel część przez $p$), potem pomnóż przez $100$.

  - key: q-one-percent
    type: question
    prompt: |
      $1\%$ pewnej liczby to $4$. Jaka to liczba?
    answer:
      type: number
      value: 400
      check: {op: whole_from_part, p: 1, part: 4}
      feedback:
        - when: "0.04"
          message: Policzyłeś $1\%$ z $4$. Tu $4$ to dopiero jeden procent szukanej liczby.
        - when: 4
          message: To tylko $1\%$. Cała liczba jest $100$ razy większa.
    explanation: |
      Skoro $1\%$ to $4$, to $100\%$ to $100 \cdot 4 = 400$.

  - key: q-twenty-percent
    type: question
    prompt: |
      $20\%$ pewnej liczby to $9$. Jaka to liczba?
    answer:
      type: number
      value: 45
      check: {op: whole_from_part, p: 20, part: 9}
      feedback:
        - when: "1.8"
          message: Policzyłeś $20\%$ z $9$. Tu $9$ to dopiero część szukanej liczby.
        - when: 180
          message: Pomnożyłeś $9 \cdot 20$. Najpierw policz $1\%$, dzieląc $9$ przez $20$.
    hint: |
      $20\%$ to jedna piąta całości.
    explanation: |
      $20\%$ to $\tfrac{1}{5}$ liczby, więc cała liczba to $5 \cdot 9 = 45$.

  - key: check-result
    type: text
    body: |
      **Sprawdzaj wynik:** policz $p\%$ z liczby, którą znalazłeś. Musi wyjść podana część.

      Przykład z poprzedniego pytania: $20\%$ z $45$ to $9$. Zgadza się!

  - key: q-pocket-money
    type: question
    prompt: |
      $25\%$ kieszonkowego Kuby to $30$ zł. Ile wynosi całe kieszonkowe?
    answer:
      type: choice
      options:
        - text: $7{,}50$ zł
          feedback: To $25\%$ z $30$ zł. Tu $30$ zł to dopiero jedna czwarta kieszonkowego.
        - text: $55$ zł
          feedback: Dodałeś $25$ do $30$. Procent nie jest kwotą do dodania.
        - text: $120$ zł
      correct: 2
    explanation: |
      $25\%$ to $\tfrac{1}{4}$, więc całe kieszonkowe to $4 \cdot 30 = 120$ zł.

  - key: q-book
    type: question
    prompt: |
      Ania przeczytała $60$ stron, czyli $40\%$ książki. Ile stron ma cała książka?
    answer:
      type: number
      value: 150
      check: {op: whole_from_part, p: 40, part: 60}
      feedback:
        - when: 24
          message: Policzyłeś $40\%$ z $60$. Tu $60$ stron to dopiero $40\%$ książki.
        - when: 90
          message: To strony, które Ani zostały do przeczytania.
    hint: |
      Ile stron to $10\%$ książki?
    explanation: |
      $40\%$ to $60$ stron, więc $10\%$ to $15$ stron, a $100\%$ to $150$ stron.

  - key: q-ticket
    type: question
    prompt: |
      Za bilet ulgowy płacisz $63$ zł, czyli $70\%$ ceny biletu normalnego.
      Ile kosztuje bilet normalny?
    answer:
      type: number
      value: 90
      unit: zł
      check: {op: whole_from_part, p: 70, part: 63}
      feedback:
        - when: "44.1"
          message: Policzyłeś $70\%$ z $63$ zł. Tu $63$ zł to dopiero $70\%$ ceny.
        - when: 27
          message: To kwota ulgi, czyli $30\%$ ceny normalnej. Pytamy o całą cenę.
    explanation: |
      $63 : 70 = 0{,}9$, więc $1\%$ ceny to $0{,}9$ zł, a $100\%$ to $90$ zł.

  - key: q-school-bikes
    type: question
    prompt: |
      W szkole $15\%$ uczniów, czyli $48$ osób, dojeżdża rowerem.
      Ilu uczniów jest w szkole?
    answer:
      type: number
      value: 320
      check: {op: whole_from_part, p: 15, part: 48}
      feedback:
        - when: "7.2"
          message: Policzyłeś $15\%$ z $48$. Tu $48$ uczniów to dopiero $15\%$ szkoły.
        - when: 720
          message: Pomnożyłeś $48 \cdot 15$. Najpierw policz $1\%$, dzieląc $48$ przez $15$.
    hint: |
      Policz najpierw, ilu uczniów to $5\%$.
    explanation: |
      $15\%$ to $48$ osób, więc $5\%$ to $16$ osób, a $100\%$ to $20 \cdot 16 = 320$ osób.
