skill: successive-changes
method: delta
title: "Misja: turniej siatkówki"
steps:
  - key: story
    type: text
    body: |
      **Szkoła organizuje turniej siatkówki** dla okolicznych szkół. Dochód trafi na sprzęt
      dla klubu sportowego, z którego za darmo korzystają dzieci z okolicy.

      Jesteś w **komitecie finansowym**. Ceny zmieniają się kilka razy, a ty pilnujesz,
      żeby turniej był uczciwy dla wszystkich.

  - key: q-family-ticket
    type: question
    prompt: |
      Bilet kosztował $10$ zł. Z powodu kosztów podniesiono cenę o $20\%$, a potem rada rodziców
      wprowadziła zniżkę $10\%$ dla rodzin. Ile płaci rodzina za bilet?
    answer:
      type: number
      value: "10.8"
      unit: zł
      check: {op: successive, n: 10, ps: [20, -10]}
      feedback:
        - when: 11
          message: Dodałeś procenty ($20\% - 10\% = 10\%$). Zniżkę liczysz od ceny $12$ zł.
        - when: 12
          message: To cena po podwyżce, bez zniżki dla rodzin.
    explanation: |
      $10 \cdot 1{,}2 = 12$ zł, a $12 \cdot 0{,}9 = 10{,}80$ zł.

  - key: q-entry-fee
    type: question
    prompt: |
      Wpisowe dla drużyny wynosiło $200$ zł. Sponsor obniżył je o $25\%$, a szkoły z małych
      miejscowości dostają dodatkowo $20\%$ zniżki od nowej ceny. Ile płaci taka szkoła?
    answer:
      type: number
      value: 120
      unit: zł
      check: {op: successive, n: 200, ps: [-25, -20]}
      feedback:
        - when: 110
          message: Dodałeś zniżki ($25\% + 20\% = 45\%$). Drugą liczysz od ceny $150$ zł.
        - when: 150
          message: To cena po zniżce od sponsora. Policz jeszcze drugą zniżkę.
    explanation: |
      $200 \cdot 0{,}75 = 150$ zł, a $150 \cdot 0{,}8 = 120$ zł.

  - key: fairness
    type: text
    body: |
      **Spór w komitecie.** Uczniowie mają płacić mniej za bilet. Są dwie propozycje:

      - **A:** dwie zniżki po $10\%$ (zniżka szkolna i zniżka za wcześniejszy zakup),
      - **B:** jedna zniżka $20\%$.

      Komitet chce wybrać opcję korzystniejszą dla uczniów.

  - key: q-fair-option
    type: question
    prompt: |
      Która propozycja jest korzystniejsza dla uczniów?
    answer:
      type: choice
      options:
        - text: Propozycja A
          feedback: Dwie zniżki po $10\%$ zostawiają $0{,}9 \cdot 0{,}9 = 0{,}81$ ceny, czyli zniżka to tylko $19\%$.
        - text: Obie tak samo
          feedback: Policz, ile ceny zostaje w każdej propozycji.
        - text: Propozycja B
      correct: 2
    explanation: |
      W A uczniowie płacą $81\%$ ceny, a w B $80\%$. Korzystniejsza jest propozycja B.

  - key: q-plan
    type: question
    prompt: |
      Rok temu turniej przyniósł $5000$ zł. W tym roku dochód wzrósł o $10\%$,
      a w przyszłym ma wzrosnąć o kolejne $10\%$. Ile komitet planuje zebrać za rok?
    answer:
      type: number
      value: 6050
      unit: zł
      check: {op: successive, n: 5000, ps: [10, 10]}
      feedback:
        - when: 6000
          message: Policzyłeś $20\%$ od $5000$ zł. Drugi wzrost liczy się od $5500$ zł.
        - when: 5500
          message: To dochód w tym roku. Policz jeszcze przyszły rok.
    explanation: |
      $5000 \cdot 1{,}1 = 5500$ zł, a $5500 \cdot 1{,}1 = 6050$ zł.

  - key: finale
    type: text
    body: |
      **Turniej był udany!** Dzięki twoim obliczeniom komitet wybrał uczciwe ceny
      i dokładnie wie, ile pieniędzy trafi na sprzęt dla dzieci.

      Zmiany procentowe widzisz na co dzień: w cenach, rabatach, oszczędnościach.

      **Pomyśl:** gdzie ostatnio widziałeś promocję „rabat na rabat”? Czy była tak korzystna, jak wyglądała?
