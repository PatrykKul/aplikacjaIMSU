skill: percent-as-fraction
title: Procent to ułamek
steps:
  - key: intro
    type: text
    body: |
      **Procent to setna część całości.** Znak $\%$ czytamy „na sto”.

      $$
      1\% = \frac{1}{100} = 0{,}01
      $$

      Tak samo każdy inny procent: $25\% = \tfrac{25}{100} = \tfrac{1}{4} = 0{,}25$.

      | Procent | Ułamek | Liczba dziesiętna |
      |---|---|---|
      | $50\%$ | $\tfrac{1}{2}$ | $0{,}5$ |
      | $25\%$ | $\tfrac{1}{4}$ | $0{,}25$ |
      | $10\%$ | $\tfrac{1}{10}$ | $0{,}1$ |
      | $100\%$ | $1$ | $1$ |

  - key: q-seven-percent
    type: question
    prompt: |
      Zapisz $7\%$ jako liczbę dziesiętną.
    answer:
      type: number
      value: "0.07"
      check: {op: to_decimal, p: 7}
      feedback:
        - when: "0.7"
          message: To jest $70\%$. Siedem setnych zapisujemy jako $0{,}07$.
        - when: 7
          message: Procent trzeba jeszcze podzielić przez $100$.
    hint: |
      $7\%$ to siedem setnych.
    explanation: |
      $7\% = \tfrac{7}{100} = 0{,}07$.

  - key: fraction-to-percent
    type: text
    body: |
      **W drugą stronę:** ułamek zamieniasz na procenty, mnożąc go przez $100\%$.

      $$
      \frac{3}{5} = 0{,}6 = 0{,}6 \cdot 100\% = 60\%
      $$

      Można też rozszerzyć ułamek tak, żeby w mianowniku było $100$:
      $\tfrac{3}{5} = \tfrac{60}{100} = 60\%$.

  - key: q-three-quarters
    type: question
    prompt: |
      Zapisz $\tfrac{3}{4}$ w procentach.
    answer:
      type: number
      value: 75
      unit: "%"
      check: {op: to_percent, x: "3/4"}
      feedback:
        - when: "0.75"
          message: To ta sama liczba zapisana dziesiętnie. Pomnóż ją przez $100$, żeby dostać procenty.
        - when: 34
          message: Ułamka nie czytamy jak dwóch cyfr obok siebie. Policz, ile to $\tfrac{3}{4}$ ze $100$.
    hint: |
      Rozszerz ułamek tak, żeby w mianowniku było $100$.
    explanation: |
      $\tfrac{3}{4} = \tfrac{75}{100} = 75\%$.

  - key: q-which-is-forty
    type: question
    prompt: |
      Który zapis oznacza $40\%$?
    answer:
      type: choice
      options:
        - text: $\tfrac{4}{100}$
          feedback: To $4\%$, czyli cztery setne.
        - text: $\tfrac{1}{40}$
          feedback: To mniej niż $3\%$. Procent to setne części, a nie „jeden przez procent”.
        - text: $0{,}4$
      correct: 2
    explanation: |
      $40\% = \tfrac{40}{100} = 0{,}4$.

  - key: q-decimal-to-percent
    type: question
    prompt: |
      Zapisz $0{,}35$ w procentach.
    answer:
      type: number
      value: 35
      unit: "%"
      check: {op: to_percent, x: "0.35"}
      feedback:
        - when: "3.5"
          message: Przesunąłeś przecinek o jedno miejsce. Mnożenie przez $100$ przesuwa go o dwa miejsca w prawo.
        - when: "0.35"
          message: To liczba dziesiętna. Żeby dostać procenty, pomnóż ją przez $100$.
    explanation: |
      $0{,}35 \cdot 100\% = 35\%$.

  - key: q-more-than-whole
    type: question
    prompt: |
      Zapisz $120\%$ jako liczbę dziesiętną.
    answer:
      type: number
      value: "1.2"
      check: {op: to_decimal, p: 120}
      feedback:
        - when: "0.12"
          message: To $12\%$. $120\%$ to więcej niż całość, więc wynik jest większy od $1$.
        - when: 12
          message: Podzieliłeś przez $10$. Procent dzielimy przez $100$.
    hint: |
      $100\%$ to $1$. Ile to będzie $120\%$?
    explanation: |
      $120\% = \tfrac{120}{100} = 1{,}2$. Procent może być większy niż $100\%$.

  - key: q-pizza
    type: question
    prompt: |
      Pizzę podzielono na $8$ równych kawałków. Zjadłeś $2$ kawałki.
      Jaki procent pizzy zjadłeś?
    answer:
      type: number
      value: 25
      unit: "%"
      check: {op: to_percent, x: "2/8"}
      feedback:
        - when: "0.25"
          message: To część pizzy zapisana dziesiętnie. Pomnóż ją przez $100$, żeby dostać procenty.
        - when: 75
          message: To ta część pizzy, która została.
    hint: |
      Zapisz zjedzoną część jako ułamek i skróć go.
    explanation: |
      $\tfrac{2}{8} = \tfrac{1}{4} = 25\%$.
