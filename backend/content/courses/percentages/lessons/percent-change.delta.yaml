skill: percent-change
method: delta
title: "Misja: kiermasz charytatywny"
steps:
  - key: story
    type: text
    body: |
      **Samorząd organizuje kiermasz.** Uczniowie przynoszą rzeczy, których już nie używają,
      a cały dochód trafi na książki i gry dla dzieci z oddziału szpitalnego.

      Odpowiadasz za **ceny**. Mają być na tyle niskie, żeby rzeczy się sprzedały,
      i na tyle wysokie, żeby zebrać jak najwięcej.

  - key: q-board-game
    type: question
    prompt: |
      Nowa gra planszowa kosztuje w sklepie $120$ zł. Na kiermaszu sprzedajecie ją o $60\%$ taniej.
      Jaka będzie cena?
    answer:
      type: number
      value: 48
      unit: zł
      check: {op: change, n: 120, p: -60}
      feedback:
        - when: 72
          message: To kwota obniżki. Odejmij ją od ceny.
        - when: 60
          message: Odjąłeś $60$ zł, a obniżka to $60$ **procent**.
    explanation: |
      Po obniżce o $60\%$ zostaje $40\%$ ceny, czyli $0{,}4 \cdot 120 = 48$ zł.

  - key: q-book
    type: question
    prompt: |
      Książka kosztowała nowa $40$ zł. Na kiermaszu jest o $75\%$ tańsza. Jaka jest cena?
    answer:
      type: number
      value: 10
      unit: zł
      check: {op: change, n: 40, p: -75}
      feedback:
        - when: 30
          message: To kwota obniżki. Odejmij ją od ceny.
    explanation: |
      Po obniżce o $75\%$ zostaje ćwierć ceny, czyli $10$ zł.

  - key: cakes
    type: text
    body: |
      **Ciasta.** Kawałek ciasta kosztuje $5$ zł. Rodzice proponują podnieść cenę o $20\%$,
      bo to akcja charytatywna i wiele osób chętnie zapłaci więcej.

  - key: q-cake-price
    type: question
    prompt: |
      Ile będzie kosztował kawałek ciasta po podwyżce o $20\%$?
    answer:
      type: number
      value: 6
      unit: zł
      check: {op: change, n: 5, p: 20}
      feedback:
        - when: 1
          message: To sama podwyżka. Dodaj ją do ceny.
        - when: 25
          message: Dodałeś $20$ zł, a podwyżka to $20$ **procent**.
    explanation: |
      $20\%$ z $5$ zł to $1$ zł, więc nowa cena to $6$ zł.

  - key: q-which-price
    type: question
    prompt: |
      Przy cenie $5$ zł sprzedajecie $60$ kawałków, a przy cenie $6$ zł tylko $55$.
      Która cena da więcej pieniędzy dla dzieci?
    answer:
      type: choice
      options:
        - text: $5$ zł
          feedback: $60 \cdot 5 = 300$ zł, a $55 \cdot 6 = 330$ zł.
        - text: $6$ zł
        - text: Obie tyle samo
          feedback: Policz dochód przy każdej cenie i porównaj.
      correct: 1
    explanation: |
      Przy $6$ zł zbieracie $330$ zł, czyli o $30$ zł więcej, mimo że sprzedajecie mniej kawałków.

  - key: q-growth
    type: question
    prompt: |
      Kiermasz zarobił w tym roku $1200$ zł, a rok temu $1000$ zł. O ile procent więcej?
    answer:
      type: number
      value: 20
      unit: "%"
      check: {op: change_percent, old: 1000, new: 1200}
      feedback:
        - when: 200
          message: To wzrost w złotych. Podziel go przez zeszłoroczny dochód.
        - when: 120
          message: Tyle procent zeszłorocznego dochodu zarobiliście teraz. Wzrost to reszta ponad $100\%$.
    explanation: |
      Wzrost to $200$ zł, a $\tfrac{200}{1000} = 20\%$.

  - key: finale
    type: text
    body: |
      **Kiermasz zebrał o $20\%$ więcej niż rok temu!** Dzieci w szpitalu dostaną nowe książki i gry.

      Ceny to nie tylko rachunek: niska cena pomaga sprzedać, a wyższa czasem daje więcej.

      **Pomyśl:** jak ustaliłbyś ceny, gdyby celem było, żeby każdy uczeń mógł coś kupić?
