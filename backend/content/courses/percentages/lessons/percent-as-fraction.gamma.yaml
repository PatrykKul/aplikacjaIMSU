skill: percent-as-fraction
method: gamma
title: "Zagadka: ile to jest 0,5%?"
steps:
  - key: problem
    type: text
    body: |
      **Zagadka:** czy $0{,}5\%$ to połowa? Czy procent może być większy niż $100\%$?

      Zanim odpowiesz, policz kilka przykładów i poszukaj reguły.

  - key: q-fifty
    type: question
    prompt: |
      Zapisz $50\%$ jako liczbę dziesiętną.
    answer:
      type: number
      value: "0.5"
      check: {op: to_decimal, p: 50}
      feedback:
        - when: 50
          message: Procent to setne części. Podziel przez $100$.
    hint: |
      Procent to setne części.
    explanation: |
      $50\% = \tfrac{50}{100} = 0{,}5$.

  - key: q-half-percent
    type: question
    prompt: |
      Teraz zapisz $0{,}5\%$ jako liczbę dziesiętną.
    answer:
      type: number
      value: "0.005"
      check: {op: to_decimal, p: "0.5"}
      feedback:
        - when: "0.5"
          message: To $50\%$. Pół procenta to sto razy mniej.
        - when: "0.05"
          message: To $5\%$. Przesuń przecinek o dwa miejsca w lewo od $0{,}5$.
    explanation: |
      $0{,}5\% = \tfrac{0{,}5}{100} = 0{,}005$.

  - key: q-what-is-half-percent
    type: question
    prompt: |
      Co oznacza $0{,}5\%$?
    answer:
      type: choice
      options:
        - text: Połowę całości
          feedback: Połowa to $50\%$. Pół procenta to dużo mniej.
        - text: To samo co $50\%$
          feedback: Porównaj swoje wyniki $0{,}5$ i $0{,}005$.
        - text: Połowę jednej setnej części
      correct: 2
    explanation: |
      $1\%$ to jedna setna, więc $0{,}5\%$ to połowa jednej setnej, czyli $0{,}005$.

  - key: q-over-hundred
    type: question
    prompt: |
      A teraz $250\%$. Zapisz jako liczbę dziesiętną.
    answer:
      type: number
      value: "2.5"
      check: {op: to_decimal, p: 250}
      feedback:
        - when: "0.25"
          message: To $25\%$. $250\%$ to więcej niż całość.
        - when: 25
          message: Przesunąłeś przecinek o jedno miejsce. Dziel przez $100$.
    explanation: |
      $250\% = \tfrac{250}{100} = 2{,}5$, czyli dwa i pół raza tyle co całość.

  - key: discovery
    type: text
    body: |
      **Twoje odkrycie:** procent to po prostu inny zapis liczby:

      $$
      p\% = \frac{p}{100}
      $$

      - $100\%$ to $1$, czyli całość,
      - więcej niż $100\%$ to liczba większa od $1$,
      - mniej niż $1\%$ to mniej niż jedna setna.

  - key: q-eighth
    type: question
    prompt: |
      ★ Zapisz $\tfrac{1}{8}$ w procentach.
    answer:
      type: number
      value: "12.5"
      unit: "%"
      check: {op: to_percent, x: "1/8"}
      feedback:
        - when: "0.125"
          message: To wynik dziesiętny. Pomnóż go przez $100\%$.
        - when: 8
          message: To mianownik ułamka, a nie procent.
    hint: |
      Ile procent to $\tfrac{1}{4}$? A połowa z tego?
    explanation: |
      $\tfrac{1}{4} = 25\%$, a $\tfrac{1}{8}$ to połowa z tego, czyli $12{,}5\%$.

  - key: q-three-halves
    type: question
    prompt: |
      Zapisz $\tfrac{3}{2}$ w procentach.
    answer:
      type: number
      value: 150
      unit: "%"
      check: {op: to_percent, x: "3/2"}
      feedback:
        - when: "1.5"
          message: To wynik dziesiętny. Pomnóż go przez $100\%$.
        - when: 32
          message: Ułamka nie czytamy jak dwóch cyfr obok siebie.
    explanation: |
      $\tfrac{3}{2} = 1{,}5 = 150\%$. Ułamek większy od $1$ daje więcej niż $100\%$.

  - key: q-tiny
    type: question
    prompt: |
      ★ Ile procent to $0{,}004$?
    answer:
      type: number
      value: "0.4"
      unit: "%"
      check: {op: to_percent, x: "0.004"}
      feedback:
        - when: 4
          message: To byłoby $0{,}04$. Przesuń przecinek o dwa miejsca w prawo.
        - when: "0.04"
          message: Przesunąłeś przecinek o jedno miejsce.
    explanation: |
      $0{,}004 \cdot 100\% = 0{,}4\%$, czyli mniej niż jeden procent.
