<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" font-family="Segoe UI, Arial, sans-serif">
<rect width="640" height="300" rx="20" fill="#f8fafc"/>
<text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">for i in range(5) — pięć okrążeń</text>
<ellipse cx="320" cy="170" rx="210" ry="88" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-dasharray="14 8"/>
<circle cx="320" cy="82" r="26" fill="#0ea5e9"/>
<text x="320" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">i=0</text>
<circle cx="520" cy="143" r="26" fill="#0ea5e9"/>
<text x="520" y="149" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">i=1</text>
<circle cx="443" cy="241" r="26" fill="#0ea5e9"/>
<text x="443" y="247" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">i=2</text>
<circle cx="197" cy="241" r="26" fill="#0ea5e9"/>
<text x="197" y="247" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">i=3</text>
<circle cx="120" cy="143" r="26" fill="#0ea5e9"/>
<text x="120" y="149" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">i=4</text>
<text x="320" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">ten sam blok kodu</text>
<text x="320" y="190" text-anchor="middle" font-size="14" fill="#475569">za każdym razem inne i</text>
<text x="320" y="286" text-anchor="middle" font-size="14" fill="#475569">liczenie zaczyna się od 0, a 5 już nie ma</text>
</svg>
