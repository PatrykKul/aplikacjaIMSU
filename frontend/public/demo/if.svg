<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" font-family="Segoe UI, Arial, sans-serif">
<rect width="640" height="300" rx="20" fill="#f8fafc"/>
<text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">if / else — rozwidlenie drogi</text>
<polygon points="320,64 440,124 320,184 200,124" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
<text x="320" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f" font-family="Consolas, monospace">wiek &gt;= 18 ?</text>
<path d="M200 124 H110 V200" fill="none" stroke="#10b981" stroke-width="4"/>
<path d="M440 124 H530 V200" fill="none" stroke="#ef4444" stroke-width="4"/>
<polygon points="110,214 100,196 120,196" fill="#10b981"/>
<polygon points="530,214 520,196 540,196" fill="#ef4444"/>
<text x="150" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">True</text>
<text x="490" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">False</text>
<rect x="24" y="216" width="172" height="56" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="3"/>
<text x="110" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">blok pod if</text>
<rect x="444" y="216" width="172" height="56" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
<text x="530" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">blok pod else</text>
